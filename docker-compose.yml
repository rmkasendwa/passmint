name: passmint

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passmint}
      POSTGRES_USER: ${POSTGRES_USER:-passmint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passmint}
    expose:
      - '5432'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-passmint} -d ${POSTGRES_DB:-passmint}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    env_file:
      - .env
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-passmint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-passmint-dev-secret}
    expose:
      - '9000'
      - '9001'
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-passmint}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-passmint-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-passmint-event-images}
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"

  app:
    image: passmint
    profiles:
      - app
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3000}}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://passmint:passmint@postgres:5432/passmint}
      API_PORT: ${API_PORT:-3000}
      WEB_PORT: ${WEB_PORT:-8088}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3000}}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8088}
      S3_BUCKET: ${S3_BUCKET:-passmint-event-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-passmint}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-passmint-dev-secret}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/passmint-event-images}
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
      - '${WEB_PORT:-8088}:${WEB_PORT:-8088}'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
